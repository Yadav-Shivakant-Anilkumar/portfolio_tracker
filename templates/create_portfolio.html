{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-vault-950 via-vault-900 to-vault-950">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <h1 class="font-display text-3xl font-bold tracking-tight mb-2">New Portfolio</h1>
      <p class="text-vault-400">Add a tracker for your assets.</p>
    </div>

    <div class="glass-card rounded-3xl p-8 shadow-2xl relative">
      <!-- Close Button -->
      <a href="{{ url_for('dashboard') }}" class="absolute top-6 right-6 text-vault-500 hover:text-vault-200 hover:bg-vault-800/50 w-8 h-8 rounded-full flex items-center justify-center transition-all duration-300" title="Close and return to dashboard">
        <i class="fa-solid fa-xmark"></i>
      </a>

      <form action="{{ url_for('create_portfolio') }}" method="POST" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Portfolio Name</label>
          <input type="text" name="name" placeholder="e.g. My Stocks" required
                 class="w-full bg-vault-850/50 border-vault-700">
        </div>

        <div>
          <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Asset Category</label>
          <select name="type" class="w-full bg-vault-850 border-vault-700" required>
            <option value="Stock">Stock Market</option>
            <option value="Crypto">Cryptocurrency</option>
            <option value="Cash">Cash / Savings</option>
            <option value="Other">Other Assets</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Initial Capital</label>
            <input type="number" step="0.01" name="capital" placeholder="0.00" required
                   class="w-full bg-vault-850/50 border-vault-700">
          </div>
          <div>
            <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Current P/L</label>
            <input type="number" step="0.01" name="pl" placeholder="0.00" required
                   class="w-full bg-vault-850/50 border-vault-700">
          </div>
        </div>

        <div class="flex items-center gap-4 pt-2">
          <a href="{{ url_for('dashboard') }}" class="btn-ghost flex-1 text-center font-semibold">
            Cancel
          </a>
          <button type="submit" class="btn-primary flex-1 flex items-center justify-center gap-2">
            <span>Create</span>
            <i class="fa-solid fa-check text-xs"></i>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
