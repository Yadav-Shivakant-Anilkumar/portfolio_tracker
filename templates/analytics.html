{% extends 'base.html' %}

{% block content %}
<div class="flex min-h-screen bg-vault-950">
  {% include 'sidebar.html' %}

  <main class="flex-1 ml-64 p-8">
    <header class="mb-8">
      <h1 class="font-display text-3xl font-bold tracking-tight mb-2">Analytics</h1>
      <p class="text-vault-400">Portfolio allocation and category breakdown.</p>
    </header>

    <div class="grid grid-cols-3 gap-5">
      <!-- Allocation Donut Chart -->
      <div class="col-span-1 glass-card rounded-2xl p-6">
        <h3 class="font-display font-semibold mb-1">Allocation</h3>
        <p class="text-vault-400 text-sm mb-5">By asset category</p>
        <canvas id="allocationChart" width="200" height="200" class="mx-auto mb-5"></canvas>
        <div class="space-y-3" id="allocation-legend"></div>
      </div>

      <!-- Category Performance Table -->
      <div class="col-span-2 glass-card rounded-2xl overflow-hidden">
        <div class="px-6 py-5 border-b border-vault-700">
          <h3 class="font-display font-semibold">Category Breakdown</h3>
          <p class="text-vault-400 text-sm">Performance per asset class</p>
        </div>
        <div id="cat-table-body" class="divide-y divide-vault-700 text-sm">
          <div class="px-6 py-10 text-center text-vault-400">
            <i class="fa-solid fa-chart-pie text-2xl text-vault-600 mb-3 block"></i>
            Add transactions to see analytics.
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
  const alloc = {{ allocation_json | safe }};
  const labels = alloc.labels;
  const values = alloc.values;
  const colors = ['#E8A924', '#F97316', '#22C55E', '#6366F1', '#8B5CF6', '#06B6D4'];
  const currSymbol = {{ currency_symbol | tojson }};

  function drawChart() {
    const canvas = document.getElementById('allocationChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = 200 * dpr; canvas.height = 200 * dpr;
    ctx.scale(dpr, dpr);
    const cx = 100, cy = 100, radius = 80, innerRadius = 55;

    if (!labels.length) {
      ctx.fillStyle = '#2a2a35';
      ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2);
      ctx.arc(cx, cy, innerRadius, 0, Math.PI*2, true); ctx.fill();
      ctx.fillStyle = '#7a7a94'; ctx.font = '12px DM Sans';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('No data', cx, cy); return;
    }

    const total = values.reduce((a, b) => a + b, 0);
    let startAngle = -Math.PI / 2;
    values.forEach((val, i) => {
      const sliceAngle = (val / total) * Math.PI * 2;
      const endAngle = startAngle + sliceAngle;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, startAngle, endAngle);
      ctx.arc(cx, cy, innerRadius, endAngle, startAngle, true);
      ctx.closePath(); ctx.fillStyle = colors[i % colors.length]; ctx.fill();
      // Gap
      ctx.beginPath();
      ctx.arc(cx, cy, radius, endAngle - 0.02, endAngle + 0.02);
      ctx.arc(cx, cy, innerRadius, endAngle + 0.02, endAngle - 0.02, true);
      ctx.closePath(); ctx.fillStyle = '#16161b'; ctx.fill();
      startAngle = endAngle;
    });

    ctx.fillStyle = '#e8e8f0'; ctx.font = 'bold 15px Space Grotesk';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Allocation', cx, cy - 6);
    ctx.fillStyle = '#7a7a94'; ctx.font = '11px DM Sans';
    ctx.fillText('by category', cx, cy + 14);

    // Legend
    const legend = document.getElementById('allocation-legend');
    if (legend) {
      legend.innerHTML = labels.map((lbl, i) =>
        `<div class="flex items-center justify-between text-sm">
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-sm" style="background:${colors[i % colors.length]}"></div>${lbl}
          </div>
          <span class="text-vault-300 font-medium">${values[i]}%</span>
        </div>`
      ).join('');
    }

    // Category Table
    const tbody = document.getElementById('cat-table-body');
    if (tbody && labels.length) {
      tbody.innerHTML = `
        <div class="grid grid-cols-3 gap-4 px-6 py-3 text-xs uppercase tracking-wider text-vault-500 bg-vault-900/50">
          <span>Category</span><span class="text-right">Allocation</span><span class="text-right">Share</span>
        </div>` +
        labels.map((lbl, i) => `
          <div class="grid grid-cols-3 gap-4 px-6 py-4 hover:bg-vault-800/40 transition-colors items-center">
            <div class="flex items-center gap-2">
              <div class="w-3 h-3 rounded-sm" style="background:${colors[i % colors.length]}"></div>
              <span class="font-medium">${lbl}</span>
            </div>
            <div class="text-right">
              <div class="h-2 rounded-full bg-vault-700 overflow-hidden">
                <div class="h-2 rounded-full" style="width:${values[i]}%; background:${colors[i % colors.length]}"></div>
              </div>
            </div>
            <span class="text-right font-semibold text-vault-200">${values[i]}%</span>
          </div>`
        ).join('');
    }
  }

  document.addEventListener('DOMContentLoaded', drawChart);
</script>
{% endblock %}
