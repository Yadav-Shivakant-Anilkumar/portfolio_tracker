<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaultfolio | Professional Portfolio Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vault: {
                            50: '#f8f8f9', 100: '#e8e8f0', 200: '#d1d1e1', 300: '#b1b1cc', 
                            400: '#8c8cb3', 500: '#6d6d99', 600: '#56567d', 700: '#464663', 
                            800: '#3a3a4f', 850: '#2a2a35', 900: '#16161b', 950: '#0b0b0e'
                        },
                        amber: { DEFAULT: '#E8A924', dark: '#C78E1A' },
                        gain: '#22C55E', loss: '#EF4444'
                    },
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        sans: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        body { background-color: #0b0b0e; color: #e8e8f0; font-family: 'DM Sans', sans-serif; }
        .glass-card { background: rgba(22, 22, 27, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-item { @apply flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300; }
        .nav-item:hover { background: rgba(232, 169, 36, 0.1); color: #E8A924; }
        .nav-item.active { background: #E8A924; color: #0b0b0e; font-weight: 600; }
        .btn-primary { background: #E8A924; color: #0b0b0e; @apply font-semibold py-3 px-6 rounded-xl hover:bg-amber-dark transition-all shadow-lg shadow-amber/10; }
        .btn-ghost { background: rgba(255, 255, 255, 0.05); @apply py-3 px-6 rounded-xl hover:bg-white/10 transition-all border border-white/5; }
        input, select, textarea { background: rgba(255, 255, 255, 0.03) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; @apply rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber/50 outline-none transition-all; }
        .badge { @apply px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider; }
        .badge-gain { background: rgba(34, 197, 94, 0.1); color: #22C55E; }
        .badge-loss { background: rgba(239, 68, 68, 0.1); color: #EF4444; }
    </style>
</head>
<body class="antialiased">
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="fixed top-6 right-6 z-50 flex flex-col gap-3">
          {% for category, message in messages %}
            <div class="px-5 py-3 rounded-xl border flex items-center gap-3 animate-slide-in 
                {% if category == 'error' %} bg-loss/10 border-loss/20 text-loss {% else %} bg-gain/10 border-gain/20 text-gain {% endif %} shadow-2xl">
              <i class="fa-solid {% if category == 'error' %}fa-circle-xmark{% else %}fa-circle-check{% endif %}"></i>
              <span class="text-sm font-medium">{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
