{% extends 'base.html' %}

{% block content %}
<div class="flex min-h-screen bg-vault-950">
  {% include 'sidebar.html' %}

  <main class="flex-1 ml-64">
    <header class="sticky top-0 z-20 bg-vault-950/80 backdrop-blur-xl border-b border-vault-700 px-8 py-4">
      <div class="flex items-center gap-3 text-vault-400 text-sm">
        <a href="{{ url_for('dashboard') }}" class="hover:text-vault-200 transition-colors"><i class="fa-solid fa-arrow-left"></i></a>
        <span>/</span>
        <span>Add Entry</span>
      </div>
      <h2 class="font-display text-xl font-bold mt-1">New Transaction</h2>
    </header>

    <div class="p-8 max-w-3xl">
      <form method="POST" action="{{ url_for('add_entry') }}">
        <!-- Transaction Type -->
        <div class="form-group mb-6">
          <label>Transaction Type</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" onclick="selectTxType('buy', this)" class="tx-type-btn btn-ghost py-4 rounded-xl text-sm text-center flex items-center justify-center gap-2 border-gain text-gain bg-gain/10">
              <i class="fa-solid fa-arrow-down"></i> Buy
            </button>
            <button type="button" onclick="selectTxType('sell', this)" class="tx-type-btn btn-ghost py-4 rounded-xl text-sm text-center flex items-center justify-center gap-2">
              <i class="fa-solid fa-arrow-up"></i> Sell
            </button>
          </div>
          <input type="hidden" name="tx_type" id="selected-tx-type" value="buy">
        </div>

        <!-- Asset Search -->
        <div class="form-group mb-6">
          <label for="asset-search">Search Asset</label>
          <div class="relative">
            <input type="text" id="asset-search" class="vault-input w-full px-4 py-3 rounded-xl text-sm pr-12" placeholder="Type symbol or name..." oninput="filterAssets(this.value)" autocomplete="off" required>
            <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-vault-500 text-xs"></i>
            <!-- Dropdown -->
            <div id="asset-dropdown" class="absolute top-full left-0 right-0 mt-2 bg-vault-800 border border-vault-700 rounded-xl overflow-hidden z-10 shadow-2xl" style="display:none;">
              <!-- Populated by JS -->
            </div>
          </div>
          <input type="hidden" name="asset_symbol" id="selected-asset" value="">
        </div>

        <div class="grid grid-cols-2 gap-5 mb-6">
          <div class="form-group">
            <label for="entry-quantity">Quantity</label>
            <input type="number" name="quantity" id="entry-quantity" class="vault-input w-full px-4 py-3 rounded-xl text-sm" placeholder="0.00" step="any" min="0.0001" required oninput="calculateTotal()">
          </div>
          <div class="form-group">
            <label for="entry-price">Price per Unit</label>
            <input type="number" name="price" id="entry-price" class="vault-input w-full px-4 py-3 rounded-xl text-sm" placeholder="0.00" step="any" min="0.01" required oninput="calculateTotal()">
          </div>
        </div>

        <!-- Total -->
        <div class="glass-card rounded-xl p-4 mb-6 flex items-center justify-between">
          <span class="text-vault-400 text-sm">Estimated Total</span>
          <span class="font-display text-xl font-bold" id="entry-total">₹0.00</span>
        </div>

        <div class="grid grid-cols-2 gap-5 mb-6">
          <div class="form-group">
            <label for="entry-date">Date</label>
            <input type="date" name="entry_date" id="entry-date" class="vault-input w-full px-4 py-3 rounded-xl text-sm" required>
          </div>
          <div class="form-group">
            <label for="entry-category">Category</label>
            <select name="category" id="entry-category" class="vault-select w-full px-4 py-3 rounded-xl text-sm">
              <option value="stocks">Stocks</option>
              <option value="crypto">Crypto</option>
              <option value="bonds">Bonds</option>
              <option value="commodities">Commodities</option>
              <option value="realestate">Real Estate</option>
              <option value="cash">Cash</option>
            </select>
          </div>
        </div>

        <div class="form-group mb-8">
          <label for="entry-notes">Notes (optional)</label>
          <textarea name="notes" id="entry-notes" class="vault-input w-full px-4 py-3 rounded-xl text-sm resize-none" rows="3" placeholder="Add any notes about this transaction..."></textarea>
        </div>

        <div class="flex gap-3">
          <a href="{{ url_for('dashboard') }}" class="btn-ghost flex-1 py-3.5 rounded-xl text-sm font-display text-center inline-block leading-loose">Cancel</a>
          <button type="submit" class="btn-primary flex-1 py-3.5 rounded-xl text-sm font-display"><span>Add Transaction</span></button>
        </div>
      </form>
    </div>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const dateInput = document.getElementById('entry-date');
    if (dateInput && !dateInput.value) {
      dateInput.value = new Date().toISOString().split('T')[0];
    }
  });

  let searchTimeout = null;

  function selectTxType(type, btn) {
    document.getElementById('selected-tx-type').value = type;
    document.querySelectorAll('.tx-type-btn').forEach(b => {
      b.className = 'tx-type-btn btn-ghost py-4 rounded-xl text-sm text-center flex items-center justify-center gap-2';
    });
    if (type === 'buy') {
      btn.classList.add('border-gain', 'text-gain', 'bg-gain/10');
    } else {
      btn.classList.add('border-loss', 'text-loss', 'bg-loss/10');
    }
  }

  function filterAssets(query) {
    const dropdown = document.getElementById('asset-dropdown');
    if (!query.trim() || query.length < 2) { 
        dropdown.style.display = 'none'; 
        return; 
    }

    // Debounce the search
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(async () => {
        try {
            const response = await fetch(`/api/search_assets?q=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (data.length === 0) {
                dropdown.innerHTML = `
                    <div class="px-4 py-3 text-vault-500 text-xs italic">
                        No matches found. You can still type the symbol manually.
                    </div>
                `;
                dropdown.style.display = 'block';
                return;
            }

            dropdown.style.display = 'block';
            dropdown.innerHTML = data.map(a => `
                <button type="button" 
                        onclick="selectAsset('${a.symbol}', '${a.name.replace(/'/g, "\\'")}', '${a.category}')" 
                        class="w-full px-4 py-3 flex items-center gap-3 hover:bg-vault-700/50 transition-colors text-left border-b border-vault-700 last:border-0">
                    <div class="w-9 h-9 rounded-lg bg-amber/10 flex items-center justify-center font-display font-bold text-amber text-xs">
                        ${a.symbol.slice(0,2)}
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <div class="font-medium text-sm truncate">${a.symbol}</div>
                        <div class="text-vault-500 text-[10px] truncate">${a.name} (${a.exchange || 'Unknown'})</div>
                    </div>
                    <div class="text-vault-400 text-[10px] uppercase tracking-wider font-bold">
                        ${a.category === 'equity' ? 'Stock' : a.category === 'cryptocurrency' ? 'Crypto' : a.category}
                    </div>
                </button>
            `).join('');
        } catch (err) {
            console.error('Search failed:', err);
        }
    }, 300);
  }

  function selectAsset(symbol, name, category) {
    document.getElementById('selected-asset').value = symbol;
    document.getElementById('asset-search').value = symbol + ' — ' + name;
    document.getElementById('asset-dropdown').style.display = 'none';
    
    // Auto-detect category mapping
    const catSelect = document.getElementById('entry-category');
    let targetVal = 'stocks';
    if (category.includes('crypto')) targetVal = 'crypto';
    
    catSelect.value = targetVal;
    
    // Fetch live price
    fetchPrice(symbol);
  }

  async function fetchPrice(symbol) {
    const priceInput = document.getElementById('entry-price');
    priceInput.placeholder = "Loading price...";
    try {
        const response = await fetch(`/api/get_price/${symbol}`);
        const data = await response.json();
        if (data.price > 0) {
            priceInput.value = data.price;
            calculateTotal();
        } else {
            priceInput.placeholder = "0.00";
        }
    } catch (err) {
        priceInput.placeholder = "0.00";
    }
  }

  function calculateTotal() {
    const qty = parseFloat(document.getElementById('entry-quantity').value) || 0;
    const price = parseFloat(document.getElementById('entry-price').value) || 0;
    const total = qty * price;
    document.getElementById('entry-total').textContent = '₹' + total.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
</script>
{% endblock %}
