{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-vault-950 via-vault-900 to-vault-950">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber to-amber-dark flex items-center justify-center mx-auto mb-6 shadow-2xl shadow-amber/20">
        <i class="fa-solid fa-user-plus text-vault-950 text-2xl"></i>
      </div>
      <h1 class="font-display text-3xl font-bold tracking-tight mb-2">Create Account</h1>
      <p class="text-vault-400">Join the elite wealth trackers.</p>
    </div>

    <div class="glass-card rounded-3xl p-8 shadow-2xl">
      <form action="{{ url_for('register') }}" method="POST" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-vault-600"></i>
            <input type="text" name="full_name" placeholder="John Doe" required
                   class="w-full pl-11 bg-vault-850/50 border-vault-700 focus:border-amber/50">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-vault-600"></i>
            <input type="email" name="email" placeholder="name@company.com" required
                   class="w-full pl-11 bg-vault-850/50 border-vault-700 focus:border-amber/50">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-vault-600"></i>
            <input type="password" name="password" placeholder="••••••••" required
                   class="w-full pl-11 bg-vault-850/50 border-vault-700 focus:border-amber/50">
          </div>
        </div>

        <button type="submit" class="btn-primary w-full mt-4 flex items-center justify-center gap-2">
          <span>Get Started</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-vault-400 mt-8">
      Already have an account? <a href="{{ url_for('login') }}" class="text-amber font-semibold hover:underline">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
