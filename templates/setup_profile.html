{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-vault-950 via-vault-900 to-vault-950">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <h1 class="font-display text-3xl font-bold tracking-tight mb-2">Complete Profile</h1>
      <p class="text-vault-400">Set your base currency and details.</p>
    </div>

    <div class="glass-card rounded-3xl p-8 shadow-2xl">
      <form action="{{ url_for('setup_profile') }}" method="POST" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Base Currency</label>
          <select name="currency" class="w-full bg-vault-850 border-vault-700">
            <option value="INR">Indian Rupee (INR)</option>
            <option value="USD">US Dollar (USD)</option>
            <option value="EUR">Euro (EUR)</option>
            <option value="GBP">British Pound (GBP)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-vault-400 uppercase tracking-widest mb-2 ml-1">Phone Number (Optional)</label>
          <input type="text" name="phone" placeholder="+91 98765 43210"
                 class="w-full bg-vault-850/50 border-vault-700">
        </div>

        <button type="submit" class="btn-primary w-full flex items-center justify-center gap-2">
          <span>Continue</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
