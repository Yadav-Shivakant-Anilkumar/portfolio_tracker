{% extends 'base.html' %}

{% block content %}
<div class="auth-bg"><div class="auth-blob-center"></div></div>
<div class="grid-pattern"></div>
<div class="relative z-10 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-amber to-amber-dark mb-5">
        <i class="fa-solid fa-vault text-vault-950 text-xl"></i>
      </div>
      <h1 class="font-display text-3xl font-bold tracking-tight text-vault-100">Vaultfolio</h1>
      <p class="text-vault-400 mt-2 text-sm">Track your investments with precision</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-2xl p-8">
      <h2 class="font-display text-xl font-semibold mb-1">Welcome back</h2>
      <p class="text-vault-400 text-sm mb-8">Sign in to access your portfolio</p>

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group mb-5">
          <label for="login-email">Email Address</label>
          <input type="email" name="email" id="login-email" class="vault-input w-full px-4 py-3 rounded-xl text-sm font-body" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group mb-6">
          <label for="login-password">Password</label>
          <div class="relative">
            <input type="password" name="password" id="login-password" class="vault-input w-full px-4 py-3 rounded-xl text-sm font-body pr-12" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-vault-400 hover:text-vault-200 transition-colors" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between mb-8">
          <label class="flex items-center gap-2 cursor-pointer text-sm text-vault-400 hover:text-vault-200 transition-colors">
            <input type="checkbox" class="w-4 h-4 rounded border-vault-600 bg-vault-800 accent-amber">
            Remember me
          </label>
          <a href="#" class="text-sm text-amber hover:text-amber-light transition-colors" onclick="event.preventDefault(); showToast('Check your email for reset instructions', 'info')">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary w-full py-3.5 rounded-xl text-sm font-display">
          <span>Sign In</span>
        </button>
      </form>

      <div class="relative my-7">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-vault-700"></div></div>
        <div class="relative flex justify-center"><span class="bg-vault-850 px-4 text-xs text-vault-500 uppercase tracking-wider">or continue with</span></div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="showToast('Google OAuth would be connected here', 'info')" class="btn-ghost py-3 rounded-xl text-sm flex items-center justify-center gap-2">
          <i class="fa-brands fa-google"></i> Google
        </button>
        <button type="button" onclick="showToast('GitHub OAuth would be connected here', 'info')" class="btn-ghost py-3 rounded-xl text-sm flex items-center justify-center gap-2">
          <i class="fa-brands fa-github"></i> GitHub
        </button>
      </div>
    </div>

    <p class="text-center text-sm text-vault-400 mt-6">
      Don't have an account?
      <a href="{{ url_for('register') }}" class="text-amber hover:text-amber-light transition-colors font-medium">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
